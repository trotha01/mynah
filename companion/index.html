<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>J</title>
<style>
:root{--bg:#f4efe6;--fg:#3a2f2a;--shell:#7fc8c4;--shell2:#5fa8a4;--metal:#5b6b73;--screen:#1e2b30;--glow:#9ff3ea;--amber:#ffb347;--green:#6ee7a0;--blush:#ff9aa8}
@media (prefers-color-scheme:dark){:root{--bg:#171a1c;--fg:#e8e0d4;--shell:#4f9a96;--shell2:#3c7a77;--metal:#7c8b93;--screen:#0c1417}}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:13px -apple-system,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
svg{width:min(88vw,70vh);max-width:420px;height:auto;overflow:visible}
#note{position:fixed;top:14px;left:50%;transform:translateX(-50%) translateY(-8px);max-width:86vw;padding:8px 14px;border-radius:999px;background:var(--bubble,#fff);color:#1b2b2a;box-shadow:0 2px 10px #0003;font-size:14px;font-weight:600;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#note.show{opacity:1;transform:translateX(-50%)}
#note i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px;background:var(--dot)}
#label{margin-top:10px;opacity:.55;letter-spacing:.04em;min-height:1.2em}
.bot{transform-box:fill-box;transform-origin:50% 100%}
.led{fill:var(--metal);transition:fill .3s}
.bar{transform-box:fill-box;transform-origin:50% 50%}
#smile,#bars,#dots,#zzz,#bang{transition:opacity .15s}
#bars,#dots,#zzz,#bang{opacity:0}
.scr{transition:opacity .4s}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes breathe{50%{transform:scale(1.012,1.02)}}
@keyframes lean{50%{transform:rotate(-2.5deg) translateY(2px)}}
@keyframes jump{0%{transform:translateY(0) scale(1)}35%{transform:translateY(-26px) scale(1.05,.95)}100%{transform:translateY(0) scale(1)}}
@keyframes sway{50%{transform:rotate(3deg)}}
@keyframes pulse{50%{opacity:.25}}
@keyframes dot{50%{transform:translateY(-6px)}}
#dots circle{transform-box:fill-box;animation:dot 1.1s infinite}#dots circle:nth-child(2){animation-delay:.18s}#dots circle:nth-child(3){animation-delay:.36s}
/* body motion and antenna colour by state; the eyes, brows and blush are driven from the script */
[data-s=off] .scr{opacity:.35}
[data-s=off] #zzz{opacity:1}
[data-s=off] #smile{opacity:0}
[data-s=loading] .bot{animation:breathe 3s ease-in-out infinite}
[data-s=loading] .led{fill:var(--amber);animation:pulse .8s infinite}
[data-s=listening] .bot{animation:breathe 4.5s ease-in-out infinite}
[data-s=listening] .led{fill:var(--green)}
[data-s=hearing] .bot{animation:lean .7s ease-in-out infinite}
[data-s=hearing] .led{fill:var(--green);animation:pulse .5s infinite}
[data-s=waiting] .bot,[data-s=transcribing] .bot{animation:breathe 4.5s ease-in-out infinite}
[data-s=waiting] .led,[data-s=transcribing] .led{fill:var(--amber);animation:pulse 1s infinite}
[data-s=waiting] #dots,[data-s=transcribing] #dots{opacity:1}
[data-s=waiting] #smile,[data-s=transcribing] #smile{opacity:0}
[data-s=speaking] .bot{animation:bob .55s ease-in-out infinite}
[data-s=speaking] .led{fill:var(--glow)}
[data-s=speaking] #bars{opacity:1}
[data-s=speaking] #smile{opacity:0}
[data-s=barge] .bot{animation:jump .55s ease-out 1}
[data-s=barge] .led{fill:#ff6b6b}
[data-s=barge] #bang{opacity:1}
[data-s=barge] #smile{opacity:0}
</style></head><body>
<svg id="bolt" viewBox="0 0 200 215" data-s="off">
 <defs>
  <clipPath id="clipL"><rect x="64" y="82" width="26" height="24" rx="10"/></clipPath>
  <clipPath id="clipR"><rect x="110" y="82" width="26" height="24" rx="10"/></clipPath>
 </defs>
 <g class="bot" id="bot">
  <line x1="100" y1="34" x2="100" y2="58" stroke="var(--metal)" stroke-width="5"/>
  <circle class="led" cx="100" cy="29" r="9"/>
  <rect x="38" y="58" width="124" height="104" rx="30" fill="var(--shell)"/>
  <rect x="22" y="94" width="14" height="30" rx="7" fill="var(--metal)"/><rect x="164" y="94" width="14" height="30" rx="7" fill="var(--metal)"/>
  <rect x="62" y="162" width="76" height="30" rx="12" fill="var(--shell2)"/>
  <rect x="50" y="70" width="100" height="72" rx="20" fill="var(--screen)"/>
  <g class="scr">
   <ellipse id="blushL" cx="62" cy="116" rx="7" ry="4" fill="var(--blush)" opacity="0"/>
   <ellipse id="blushR" cx="138" cy="116" rx="7" ry="4" fill="var(--blush)" opacity="0"/>
   <!-- each eye: glow shape + pupil + top lid (slant for thinking/stern) + bottom lid (raised = happy ^ eye), clipped to the eye -->
   <g id="eyeL"><g clip-path="url(#clipL)">
     <rect x="64" y="82" width="26" height="24" rx="10" fill="var(--glow)"/>
     <circle id="pupL" cx="77" cy="94" r="6" fill="var(--screen)"/>
     <rect id="topL" x="54" y="36" width="46" height="44" fill="var(--screen)"/>
     <ellipse id="botL" cx="77" cy="124" rx="20" ry="16" fill="var(--screen)"/>
   </g></g>
   <g id="eyeR"><g clip-path="url(#clipR)">
     <rect x="110" y="82" width="26" height="24" rx="10" fill="var(--glow)"/>
     <circle id="pupR" cx="123" cy="94" r="6" fill="var(--screen)"/>
     <rect id="topR" x="100" y="36" width="46" height="44" fill="var(--screen)"/>
     <ellipse id="botR" cx="123" cy="124" rx="20" ry="16" fill="var(--screen)"/>
   </g></g>
   <line id="browL" x1="64" y1="77" x2="90" y2="77" stroke="var(--glow)" stroke-width="4" stroke-linecap="round" opacity=".9"/>
   <line id="browR" x1="110" y1="77" x2="136" y2="77" stroke="var(--glow)" stroke-width="4" stroke-linecap="round" opacity=".9"/>
   <path id="smile" d="M84 124q16 12 32 0" stroke="var(--glow)" stroke-width="5" fill="none" stroke-linecap="round"/>
   <g id="bars" fill="var(--glow)">
    <rect class="bar" x="72" y="124" width="9" height="6" rx="4.5"/><rect class="bar" x="85" y="124" width="9" height="6" rx="4.5"/>
    <rect class="bar" x="96" y="124" width="9" height="6" rx="4.5"/><rect class="bar" x="107" y="124" width="9" height="6" rx="4.5"/>
    <rect class="bar" x="120" y="124" width="9" height="6" rx="4.5"/>
   </g>
   <g id="dots" fill="var(--glow)"><circle cx="86" cy="130" r="4"/><circle cx="100" cy="130" r="4"/><circle cx="114" cy="130" r="4"/></g>
   <text id="bang" x="100" y="138" text-anchor="middle" font-size="24" font-weight="700" fill="var(--amber)">!</text>
  </g>
  <g id="zzz" fill="var(--metal)" font-weight="700" font-size="16"><text x="158" y="48">z</text><text x="170" y="34" font-size="12">z</text></g>
 </g>
</svg>
<div id="note"><i></i><span></span></div>
<div id="label"></div>
<script>
const $=id=>document.getElementById(id);
const svg=$('bolt'),label=$('label'),bot=$('bot');
const bars=[...document.querySelectorAll('.bar')];
const LABEL={off:'asleep (voice mode off)',loading:'waking up…',listening:'listening',hearing:'hearing you',transcribing:'thinking…',waiting:'thinking…',speaking:'',barge:'oh!'};
let state='off',prev='off',level=0,target=0,lastOk=0,bargeUntil=0,isQ=false,noteN=-1,noteUntil=0,noteKind='';
function setState(s){
  if(s===state)return;
  prev=state;state=s;
  if(prev==='speaking'&&(s==='hearing'||s==='transcribing')){bargeUntil=performance.now()+650;} // barge-in: the user cut the speech off
}
async function poll(){
  try{
    const r=await fetch('/api/s',{cache:'no-store'});const j=await r.json();
    lastOk=performance.now();target=Math.min(1,j.level*5);isQ=!!j.q;setState(j.state);showNote(j.note);
  }catch(e){ if(performance.now()-lastOk>4000){target=0;setState('off');} }
}
const KCOL={waiting:'#6ee7a0',needs_you:'#ffb347',done:'#7fc8c4',blocked:'#ff6b6b'};
function showNote(n){   // a worker session changed status (the server also speaks it when voice mode is on)
  if(!n){return}
  if(noteN===-1){noteN=n.n;if(n.age>20)return}          // a page opened later only shows a recent one
  else if(n.n===noteN)return;
  noteN=n.n;noteKind=n.kind;noteUntil=performance.now()+9000;
  const el=$('note');el.querySelector('span').textContent=n.text;el.style.setProperty('--dot',KCOL[n.kind]||'#999');el.classList.add('show');
  clearTimeout(showNote.t);showNote.t=setTimeout(()=>el.classList.remove('show'),9000);
}
setInterval(poll,50);

/* ---- expression engine ----
 Idea borrowed from RoboEyes-style displays: the eye is one rounded shape; expressions come from lids laid over
 it (top lid slanted = thinking/stern, bottom lid raised = a happy ^ eye) plus brows, gaze and blinks.
 Every parameter eases toward a per-state target each frame, so nothing snaps. */
const P={open:0,squint:0,browL:0,browR:0,tilt:0,gx:0,gy:0,pup:1,blush:0,roll:0};   // current values, eased
const rnd=(a,b)=>a+Math.random()*(b-a), clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const blink={t:0,start:0,next:performance.now()+2500,dbl:false};   // blink.t != 0 while a blink is running
const sacc={x:0,y:0,next:0};                                       // idle micro-saccades
const glance={i:0,next:0};                                         // thinking glances
const GLANCES=[[-1,-.9],[1,-.8],[0,-1.1],[-.8,-.2],[.9,-.3]];
let env=0,base=0,emphT=-1e9,quietSince=0;                          // speech energy tracking
function step(t){
  const st=(t<bargeUntil)?'barge':state;
  const T={open:1,squint:0,browL:.05,browR:.05,tilt:0,gx:0,gy:0,pup:1,blush:0,roll:0};let rate=.14;
  // blinking (not while asleep or startled)
  if(t>blink.next&&st!=='off'&&st!=='barge'&&!blink.t){blink.t=1;blink.start=t;blink.next=t+(blink.dbl?180:rnd(2200,5500));blink.dbl=!blink.dbl&&Math.random()<.2}
  let bl=0;
  if(blink.t){const a=(t-blink.start)/230;bl=a<.45?a/.45:Math.max(0,1-(a-.45)/.55);if(a>=1)blink.t=0}
  // micro-saccades: tiny drifting looks so it never stares
  if(t>sacc.next){sacc.x=rnd(-.35,.35);sacc.y=rnd(-.25,.2);sacc.next=t+rnd(1100,2800)}
  switch(st){
   case 'off': T.open=.07;T.browL=T.browR=-.3;rate=.08;break;
   case 'loading': T.gx=Math.sin(t/500)*.9;T.browL=T.browR=.15;T.tilt=.15;break;
   case 'listening': T.gx=sacc.x;T.gy=sacc.y;T.browL=.1;T.browR=.15;T.pup=1.1;T.squint=.08;T.blush=.15;break;
   case 'hearing': T.open=1.12;T.browL=T.browR=.55+Math.sin(t/180)*.06;T.pup=1.35;T.gx=sacc.x*.3;T.gy=-.1;break;
   case 'waiting': case 'transcribing': {
     if(t>glance.next){glance.i=(glance.i+1+Math.floor(Math.random()*3))%GLANCES.length;glance.next=t+rnd(900,1700)}
     const g=GLANCES[glance.i];T.gx=g[0];T.gy=g[1];T.open=.92;T.browL=.55;T.browR=-.05;T.tilt=.25;T.pup=.95;rate=.2;break}
   case 'speaking': {
     env+=(level-env)*.5;base+=(level-base)*.012;                    // fast envelope vs slow running average
     if(level<.03){if(!quietSince)quietSince=t}else quietSince=0;
     // emphasis: a burst clearly above the running average squints (eye-smile) and lifts the brows for a moment
     if(env>.38&&env>base*1.5&&t-emphT>650)emphT=t;
     const e=clamp(1-(t-emphT)/380,0,1);
     // a blink in the gap between phrases
     if(quietSince&&t-quietSince>260&&!blink.t&&t>blink.next-1500)blink.next=t;
     T.open=.95+env*.28;T.browL=T.browR=.1+env*1.1+e*.5;
     T.squint=e*.62;T.blush=e*.5;T.pup=1.05;
     T.gx=sacc.x*.5+Math.sin(t/900)*.2;T.gy=sacc.y*.5;
     if(isQ){T.browL+=.35;T.browR+=.25;T.open+=.1;T.roll=3;T.tilt=-.1}   // asking something: wide-eyed, head tilt
     break}
   case 'barge': T.open=1.3;T.browL=T.browR=1;T.pup=.6;rate=.35;break;
  }
  if(t<noteUntil&&(st==='listening'||st==='waiting'||st==='transcribing'||st==='loading')){   // react to the worker news
    if(noteKind==='needs_you'){T.open=1.12;T.browL=T.browR=.9;T.pup=1.2;T.gx=0;T.gy=-.1;T.tilt=0}
    else if(noteKind==='blocked'){T.browL=.2;T.browR=.2;T.tilt=.7;T.open=.9;T.gy=.5;T.squint=0}
    else{T.squint=.5;T.browL=T.browR=.7;T.blush=.5;T.tilt=0;T.gx=0;T.gy=0}                      // waiting / done: happy
  }
  if(st!=='speaking'){env*=.8;base*=.95;quietSince=0}
  for(const k in T)P[k]+=(T[k]-P[k])*rate;
  return {bl,st};
}
function applyEyes({bl}){
  const open=clamp(P.open,.05,1.35)*(1-bl*.95);
  const sx=1+Math.max(0,open-1)*.18;
  for(const [side,cx,dir] of [['L',77,1],['R',123,-1]]){
    const cy=94;
    $('eye'+side).setAttribute('transform',`translate(${cx} ${cy}) scale(${sx.toFixed(3)} ${open.toFixed(3)}) translate(${-cx} ${-cy})`);
    const pup=$('pup'+side);
    pup.setAttribute('cx',cx+P.gx*5);pup.setAttribute('cy',cy+P.gy*4.5);pup.setAttribute('r',(6*P.pup).toFixed(2));
    // top lid slants (inner corner down) while thinking; bottom lid rises for the eye-smile
    $('top'+side).setAttribute('transform',`rotate(${(P.tilt*18*dir).toFixed(1)} ${cx} 88) translate(0 ${(clamp(P.tilt*.35,0,.6)*24).toFixed(1)})`);
    $('bot'+side).setAttribute('cy',(128-P.squint*34).toFixed(1));
    const by=77-(side==='L'?P.browL:P.browR)*5.5, inner=P.tilt*3;     // tilt pulls the inner end of the brow down
    const yL=side==='L'?by-inner:by+inner, yR=side==='L'?by+inner:by-inner;
    const b=$('brow'+side);b.setAttribute('y1',yL.toFixed(1));b.setAttribute('y2',yR.toFixed(1));b.setAttribute('opacity',open<.2?0:.9);
  }
  const bo=clamp(P.blush,0,.7).toFixed(2);$('blushL').setAttribute('opacity',bo);$('blushR').setAttribute('opacity',bo);
  bot.style.rotate=P.roll.toFixed(1)+'deg';
}
const seeds=[0.9,0.6,1,0.7,0.85];
function frame(t){
  level+=(target-level)*(target>level?0.6:0.2);          // quick attack, slower release
  const r=step(t);
  if(svg.dataset.s!==r.st)svg.dataset.s=r.st;
  document.querySelector('.led').style.fill=(t<noteUntil&&r.st!=='speaking'&&r.st!=='barge')?(KCOL[noteKind]||''):'';
  label.textContent=LABEL[r.st]??r.st;
  applyEyes(r);
  if(r.st==='speaking'){
    bars.forEach((b,i)=>{
      const wob=0.55+0.45*Math.sin(t/90*(i+1.3)+i*2);   // each bar moves a little differently
      const h=6+level*seeds[i]*(0.5+0.5*wob)*46;
      b.setAttribute('height',h.toFixed(1));b.setAttribute('y',(127-h/2).toFixed(1));
    });
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
// ?demo=speaking (&q=1 for a question) previews a state without the voice loop
const qs=new URLSearchParams(location.search),demo=qs.get('demo'),demoNote=qs.get('note');
if(demo){window.fetch=()=>Promise.resolve({json:()=>Promise.resolve({state:demo,q:qs.get('q')==='1',note:demoNote?{n:1,age:0,kind:demoNote,text:{waiting:'Saint videos is waiting for you',needs_you:'Saint videos needs you',done:'Saint videos is done',blocked:'Saint videos is blocked'}[demoNote]}:null,
  level:demo==='speaking'?(Math.sin(Date.now()/130)>-.3?0.03+Math.random()*0.17*(Math.sin(Date.now()/1700)>.5?1.6:1):0):0})})}
</script></body></html>
