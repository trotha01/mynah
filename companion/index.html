<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>J</title>
<style>
html,body{height:100%;margin:0}
body{background:#f4efe6;color:#3a2f2a;font:13px -apple-system,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;transition:background .3s}
#stage{width:min(88vw,70vh);max-width:420px}
#stage svg{width:100%;height:auto;overflow:visible}
#label{margin-top:10px;opacity:.55;letter-spacing:.04em;min-height:1.2em}
#note{position:fixed;top:14px;left:50%;transform:translateX(-50%) translateY(-8px);max-width:86vw;padding:8px 14px;border-radius:999px;background:#fff;color:#1b2b2a;box-shadow:0 2px 10px #0003;font-size:14px;font-weight:600;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#note.show{opacity:1;transform:translateX(-50%)}
#note i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px;background:var(--dot)}
</style></head><body>
<div id="stage"></div>
<div id="note"><i></i><span></span></div>
<div id="label"></div>
<script src="/engine.js"></script><script src="/looks.js"></script><script src="/anime.js"></script>
<script>
/* The live J panel: polls /api/s (voice state, audio level, worker news) and drives the chosen look with the shared
   engine. Pick the look with ?look=robot|hana|mio|yuki|mochi|sprout|nimbus|kit|orbit (default below). */
const DEFAULT_LOOK='hana02';
const qs=new URLSearchParams(location.search);
const look=LOOKS[qs.get('look')]||LOOKS[DEFAULT_LOOK];
document.body.style.background=look.card.bg;document.body.style.color=look.card.fg;
const c=new Companion(document.getElementById('stage'),look);
const label=document.getElementById('label');
const LABEL={off:'asleep (voice mode off)',loading:'waking up…',listening:'listening',hearing:'hearing you',transcribing:'thinking…',waiting:'thinking…',speaking:'',barge:'oh!'};
const IN={state:'off',level:0,q:false,noteKind:'',noteUntil:0,bargeUntil:0};
let target=0,lastOk=0,noteN=-1;
function setState(s){IN.state=s}   // the engine debounces blips and detects barge-in (speaking -> hearing that sticks) itself
const KCOL={waiting:'#6ee7a0',needs_you:'#ffb347',done:'#7fc8c4',blocked:'#ff6b6b'};
function showNote(n){   // a worker session changed status (the server also speaks it when voice mode is on)
  if(!n)return;
  if(noteN===-1){noteN=n.n;if(n.age>20)return}          // a page opened later only shows a recent one
  else if(n.n===noteN)return;
  noteN=n.n;IN.noteKind=n.kind;IN.noteUntil=performance.now()+9000;
  const el=document.getElementById('note');el.querySelector('span').textContent=n.text;el.style.setProperty('--dot',KCOL[n.kind]||'#999');el.classList.add('show');
  clearTimeout(showNote.t);showNote.t=setTimeout(()=>el.classList.remove('show'),9000);
}
async function poll(){
  try{
    const r=await fetch('/api/s',{cache:'no-store'});const j=await r.json();
    lastOk=performance.now();target=Math.min(1,j.level*5);IN.q=!!j.q;setState(j.state);showNote(j.note);
  }catch(e){ if(performance.now()-lastOk>4000){target=0;setState('off');} }
}
setInterval(poll,50);
let level=0;
function frame(t){
  level+=(target-level)*(target>level?0.6:0.2);          // quick attack, slower release
  IN.level=level;c.tick(t,IN);
  label.textContent=LABEL[c.shown||IN.state]??IN.state;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
// ?demo=speaking (&q=1 for a question, &note=done|needs_you|blocked) previews a state without the voice loop
const demo=qs.get('demo'),demoNote=qs.get('note');
if(demo){window.fetch=()=>Promise.resolve({json:()=>Promise.resolve({state:demo,q:qs.get('q')==='1',
  note:demoNote?{n:1,age:0,kind:demoNote,text:{waiting:'Saint videos is waiting for you',needs_you:'Saint videos needs you',done:'Saint videos is done',blocked:'Saint videos is blocked'}[demoNote]}:null,
  level:demo==='speaking'?(Math.sin(Date.now()/130)>-.3?0.03+Math.random()*0.17*(Math.sin(Date.now()/1700)>.5?1.6:1):0):0})})}
</script></body></html>
