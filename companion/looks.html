<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>J looks</title>
<style>
:root{--bg:#f4efe6;--fg:#3a2f2a;--line:#e0d6c6;--pill:#fff;--on:#e8743b}
@media (prefers-color-scheme:dark){:root{--bg:#171a1c;--fg:#e8e0d4;--line:#33393c;--pill:#23282a}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 -apple-system,system-ui,sans-serif}
body{padding:14px 16px 28px}
h1{font-size:18px;margin:0 0 2px}h2.sec{font-size:15px;margin:22px 0 8px;opacity:.85}.sub{margin:0 0 10px;opacity:.7}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:5;border-bottom:1px solid var(--line);margin-bottom:12px}
button{border:1px solid var(--line);background:var(--pill);color:var(--fg);padding:5px 11px;border-radius:999px;font:inherit;cursor:pointer}
button.on{background:var(--on);color:#fff;border-color:var(--on)}
.now{margin-left:auto;opacity:.65}
.big{display:flex;flex-direction:column;gap:14px}
.opt{border-radius:16px;border:1px solid var(--line);overflow:hidden;display:flex;flex-wrap:wrap}
.opt .live{flex:0 0 250px;padding:12px 10px 14px;display:flex;flex-direction:column;align-items:center}
.opt .live svg{width:100%;max-width:230px;height:auto}
.opt h3{margin:4px 0 0;font-size:18px;align-self:flex-start;padding-left:6px}.opt .live p{margin:3px 0 0;font-size:13px;opacity:.85;padding:0 6px}
.sheet{flex:1 1 420px;padding:12px 14px 14px;border-left:1px solid #0001;min-width:0}
.sheet h4{margin:8px 0 5px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.7}.sheet h4:first-child{margin-top:0}
.row{display:flex;flex-wrap:wrap;gap:8px}
.cell{text-align:center;font-size:11px;opacity:.95}
.cell svg{display:block;width:100%;height:auto;overflow:hidden;border-radius:8px;background:#ffffff14}
.row.ex .cell{width:92px}.row.mo .cell{width:70px}.row.ey .cell{width:96px}
.note{font-size:12px;opacity:.75;margin-top:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.card{border-radius:16px;border:1px solid var(--line);overflow:hidden}
.card .stage{padding:10px 10px 0;display:flex;justify-content:center}.card .stage svg{width:100%;max-width:200px;height:auto}
.card .info{padding:4px 14px 12px}.card .info b{font-size:15px}.card .info p{margin:2px 0 0;font-size:12px;opacity:.85}
</style></head><body>
<h1>J: female anime-style options</h1>
<p class="sub">Three original characters, each with an expression sheet (the fixed set J holds and eases between). Expressions are held 1 to 2.4 s minimum and blend slowly; blinks every 3 to 6.5 s. Pick one and tell me.</p>
<div class="bar" id="bar"></div>
<div class="big" id="big"></div>
<h2 class="sec">Earlier looks</h2>
<div class="grid" id="grid"></div>
<script src="/engine.js"></script><script src="/looks.js"></script><script src="/anime.js"></script>
<script>
const qs=new URLSearchParams(location.search);
const IN={state:'listening',level:0,q:false,noteKind:'',noteUntil:0,bargeUntil:0};
function setState(s){const t=performance.now();if(s===IN.state)return;
  if(IN.state==='speaking'&&(s==='hearing'||s==='transcribing'))IN.bargeUntil=t+650;IN.state=s}
const STEPS=[
 {k:'listening',l:'Listening',d:6000,go(){setState('listening')}},
 {k:'hearing',l:'Hearing you',d:3500,go(){setState('hearing')}},
 {k:'waiting',l:'Thinking',d:6500,go(){setState('waiting')}},
 {k:'speaking',l:'Speaking',d:7000,go(){setState('speaking');IN.q=false}},
 {k:'question',l:'Asking a question',d:5000,go(){setState('speaking');IN.q=true}},
 {k:'barge',l:'Barge-in',d:4000,go(){IN.q=false;setState('speaking');setTimeout(()=>setState('hearing'),900)}},
 {k:'needs_you',l:'News: needs you',d:5500,go(){setState('listening');note('needs_you')}},
 {k:'done',l:'News: done',d:5500,go(){setState('listening');note('done')}},
 {k:'blocked',l:'News: blocked',d:5500,go(){setState('listening');note('blocked')}},
 {k:'off',l:'Asleep',d:3500,go(){setState('off')}},
 {k:'loading',l:'Waking up',d:3000,go(){setState('loading')}}];
function note(k){IN.noteKind=k;IN.noteUntil=performance.now()+4500}
let idx=-1,timer=0,tour=qs.get('cycle')!=='0',live=false;
const bar=document.getElementById('bar');
const tb=document.createElement('button');tb.textContent='Auto tour';tb.onclick=()=>{tour=!tour;live=false;sync();if(tour)run((idx+1)%STEPS.length)};bar.appendChild(tb);
const lb=document.createElement('button');lb.textContent='Live (follow the real voice loop)';lb.onclick=()=>{live=!live;tour=false;clearTimeout(timer);sync()};bar.appendChild(lb);
const btns=STEPS.map((s,i)=>{const b=document.createElement('button');b.textContent=s.l;b.onclick=()=>{tour=false;live=false;clearTimeout(timer);run(i,false);sync()};bar.appendChild(b);return b});
const nowEl=document.createElement('span');nowEl.className='now';bar.appendChild(nowEl);
function sync(){tb.classList.toggle('on',tour);lb.classList.toggle('on',live);btns.forEach((b,i)=>b.classList.toggle('on',!live&&i===idx))}
function run(i,auto=true){idx=i;STEPS[i].go();nowEl.textContent=STEPS[i].l;sync();clearTimeout(timer);if(auto&&tour)timer=setTimeout(()=>run((i+1)%STEPS.length),STEPS[i].d)}

// expression sheet: the fixed set, drawn by the same look code, frozen
const EXPRS=[['neutral','Neutral'],['listening','Listening'],['thinking','Thinking'],['happy','Happy'],['speaking','Speaking',{shape:'a',mouth:.55}],['surprised','Surprised'],['concerned','Concerned']];
const MOUTHS=[['Closed',{shape:'c',mouth:0}],['A',{shape:'a',mouth:.75}],['E',{shape:'e',mouth:.6}],['I',{shape:'i',mouth:.6}],['O',{shape:'o',mouth:.6}],['U',{shape:'u',mouth:.6}],['Open smile',{shape:'D',mouth:.4,smile:1}]];
const EYES=[['Open',{}],['Half (blink)',{bl:.55}],['Closed',{bl:1}],['Happy ^',{squint:.9}],['Wide',{open:1.25,pup:.6}]];
function cells(row,list,look,vb,base){list.forEach(it=>{const d=document.createElement('div');d.className='cell';const h=document.createElement('div');d.appendChild(h);
  const lab=document.createElement('div');lab.textContent=typeof it[1]==='string'?it[1]:it[0];d.appendChild(lab);row.appendChild(d);
  const c=new Companion(h,look,{viewBox:vb});
  if(base==='ex')c.setPose(it[0],it[2]||{});else if(base==='mo')c.setPose('neutral',it[1]);else c.setPose('neutral',it[1]);})}
function sheet(look,box){
  box.innerHTML='<h4>Expressions</h4><div class="row ex"></div><h4>Mouth shapes (picked once per syllable while speaking)</h4><div class="row mo"></div><h4>Eyes</h4><div class="row ey"></div>'+
   '<div class="note">Moving parts: brow raise and tilt, eyelid opening, iris position, pupil size, mouth shape, blush, head tilt. The expression is chosen from the voice state, held at least 1 to 2.4 s, and eased in over about 0.3 s.</div>';
  cells(box.querySelector('.row.ex'),EXPRS,look,'30 26 140 150','ex');
  cells(box.querySelector('.row.mo'),MOUTHS,look,'60 124 80 40','mo');
  cells(box.querySelector('.row.ey'),EYES,look,'44 82 112 60','ey')}
const inst=[],only=qs.get('look');
const big=document.getElementById('big'),grid=document.getElementById('grid');
['hana','mio','yuki'].filter(n=>!only||n===only).forEach(n=>{const look=LOOKS[n];
  const o=document.createElement('div');o.className='opt';o.style.background=look.card.bg;o.style.color=look.card.fg;
  o.innerHTML=`<div class="live"><div class="stage"></div><h3>${look.title}</h3><p>${look.blurb}</p></div><div class="sheet"></div>`;big.appendChild(o);
  inst.push(new Companion(o.querySelector('.stage'),look));sheet(look,o.querySelector('.sheet'))});
['robot','mochi','sprout','nimbus','kit','orbit'].filter(n=>!only||n===only).forEach(n=>{const look=LOOKS[n];
  const c=document.createElement('div');c.className='card';c.style.background=look.card.bg;c.style.color=look.card.fg;
  c.innerHTML=`<div class="stage"></div><div class="info"><b>${look.title}</b><p>${look.blurb}</p></div>`;grid.appendChild(c);
  inst.push(new Companion(c.querySelector('.stage'),look))});
const frac=x=>x-Math.floor(x);
function fakeLevel(t){const ph=t/1000*4.3,k=Math.floor(ph);if(t%2300<300)return .02;
  const amp=.25+.6*frac(Math.sin(k*12.9898)*43758.5453)+(k%9===0?.3:0);return Math.min(1,Math.pow(Math.abs(Math.sin(ph*Math.PI)),1.4)*amp)}
let lvl=0,lastNote=-1,smooth=0;
async function poll(){try{const j=await (await fetch('/api/s',{cache:'no-store'})).json();
  if(live){setState(j.state);IN.q=!!j.q;lvl=Math.min(1,j.level*5);
    if(j.note&&j.note.n!==lastNote){if(lastNote!==-1||j.note.age<20){IN.noteKind=j.note.kind;IN.noteUntil=performance.now()+9000}lastNote=j.note.n}}}catch(e){}}
setInterval(()=>{if(live)poll()},50);
function stepFrame(t){let target=live?lvl:(IN.state==='speaking'?fakeLevel(t):0);
  smooth+=(target-smooth)*(target>smooth?.6:.2);IN.level=smooth;inst.forEach(c=>c.tick(t,IN))}
function frame(t){stepFrame(t);requestAnimationFrame(frame)}
requestAnimationFrame(frame);
const fixed=qs.get('state');
if(fixed){tour=false;const s=STEPS.find(x=>x.k===fixed);if(s){run(STEPS.indexOf(s),false);if(['needs_you','done','blocked'].includes(fixed))IN.noteUntil=1e12}}else run(0);
// ?warm=1 pre-runs the animation (synthetic time, 60 fps) so a still screenshot shows a settled state
if(qs.get('warm')){let t=performance.now()+20000;
  if(fixed==='barge'){for(let i=0;i<150;i++){t+=16;stepFrame(t)}IN.bargeUntil=t+60000;setState('hearing');for(let i=0;i<20;i++){t+=16;stepFrame(t)}}
  else for(let i=0;i<400;i++){t+=16;stepFrame(t)}}
sync();
</script></body></html>
