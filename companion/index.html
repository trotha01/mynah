<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bolt</title>
<style>
:root{--bg:#f4efe6;--fg:#3a2f2a;--shell:#7fc8c4;--shell2:#5fa8a4;--metal:#5b6b73;--screen:#1e2b30;--glow:#9ff3ea;--amber:#ffb347;--green:#6ee7a0}
@media (prefers-color-scheme:dark){:root{--bg:#171a1c;--fg:#e8e0d4;--shell:#4f9a96;--shell2:#3c7a77;--metal:#7c8b93;--screen:#0c1417}}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:13px -apple-system,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
svg{width:min(88vw,70vh);max-width:420px;height:auto;overflow:visible}
#label{margin-top:10px;opacity:.55;letter-spacing:.04em;min-height:1.2em}
.bot,.ant{transform-box:fill-box;transform-origin:50% 100%}
.eye{transform-box:fill-box;transform-origin:center;transition:transform .15s}
.look{transition:transform .35s}
.pupil{transform-box:fill-box;transform-origin:center;transition:transform .2s}
.led{fill:var(--metal);transition:fill .3s}
.bar{transform-box:fill-box;transform-origin:50% 50%}
#smile,#bars,#dots,#zzz,#bang{transition:opacity .15s}
#bars,#dots,#zzz,#bang{opacity:0}
.scr{transition:opacity .4s}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes lean{50%{transform:rotate(-2.5deg) translateY(2px)}}
@keyframes jump{0%{transform:translateY(0) scale(1)}35%{transform:translateY(-26px) scale(1.05,.95)}100%{transform:translateY(0) scale(1)}}
@keyframes sway{50%{transform:rotate(3deg)}}
@keyframes pulse{50%{opacity:.25}}
@keyframes dot{50%{transform:translateY(-6px)}}
#dots circle{transform-box:fill-box;animation:dot 1.1s infinite}#dots circle:nth-child(2){animation-delay:.18s}#dots circle:nth-child(3){animation-delay:.36s}
.eye{animation:blink 4.8s infinite}
/* states */
[data-s=off] .bot{animation:none}
[data-s=off] .scr{opacity:.35}
[data-s=off] .eye{animation:none;transform:scaleY(.08)}
[data-s=off] #zzz{opacity:1}
[data-s=off] #smile{opacity:0}
[data-s=loading] .bot{animation:sway 1.6s ease-in-out infinite}
[data-s=loading] .led{fill:var(--amber);animation:pulse .8s infinite}
[data-s=listening] .bot{animation:bob 3s ease-in-out infinite}
[data-s=listening] .led{fill:var(--green)}
[data-s=listening] .pupil{transform:scale(1.15)}
[data-s=hearing] .bot{animation:lean .7s ease-in-out infinite}
[data-s=hearing] .led{fill:var(--green);animation:pulse .5s infinite}
[data-s=hearing] .pupil{transform:scale(1.4)}
[data-s=hearing] .eye{transform:scale(1.12)}
[data-s=waiting] .bot,[data-s=transcribing] .bot{animation:sway 2.2s ease-in-out infinite}
[data-s=waiting] .led,[data-s=transcribing] .led{fill:var(--amber);animation:pulse 1s infinite}
[data-s=waiting] .look,[data-s=transcribing] .look{transform:translate(4px,-9px)}
[data-s=waiting] #dots,[data-s=transcribing] #dots{opacity:1}
[data-s=waiting] #smile,[data-s=transcribing] #smile{opacity:0}
[data-s=speaking] .bot{animation:bob .55s ease-in-out infinite}
[data-s=speaking] .led{fill:var(--glow)}
[data-s=speaking] #bars{opacity:1}
[data-s=speaking] #smile{opacity:0}
[data-s=barge] .bot{animation:jump .55s ease-out 1}
[data-s=barge] .led{fill:#ff6b6b}
[data-s=barge] .pupil{transform:scale(.65)}
[data-s=barge] .eye{transform:scale(1.2)}
[data-s=barge] #bang{opacity:1}
[data-s=barge] #smile{opacity:0}
</style></head><body>
<svg id="bolt" viewBox="0 0 200 215" data-s="off">
 <g class="bot">
  <line x1="100" y1="34" x2="100" y2="58" stroke="var(--metal)" stroke-width="5"/>
  <circle class="led" cx="100" cy="29" r="9"/>
  <rect x="38" y="58" width="124" height="104" rx="30" fill="var(--shell)"/>
  <rect x="22" y="94" width="14" height="30" rx="7" fill="var(--metal)"/><rect x="164" y="94" width="14" height="30" rx="7" fill="var(--metal)"/>
  <rect x="62" y="162" width="76" height="30" rx="12" fill="var(--shell2)"/>
  <rect x="50" y="70" width="100" height="72" rx="20" fill="var(--screen)"/>
  <g class="scr">
   <g class="look">
    <g class="eye"><rect x="64" y="82" width="26" height="24" rx="10" fill="var(--glow)"/><circle class="pupil" cx="77" cy="94" r="6" fill="var(--screen)"/></g>
    <g class="eye"><rect x="110" y="82" width="26" height="24" rx="10" fill="var(--glow)"/><circle class="pupil" cx="123" cy="94" r="6" fill="var(--screen)"/></g>
   </g>
   <path id="smile" d="M84 124q16 12 32 0" stroke="var(--glow)" stroke-width="5" fill="none" stroke-linecap="round"/>
   <g id="bars" fill="var(--glow)">
    <rect class="bar" x="72" y="124" width="9" height="6" rx="4.5"/><rect class="bar" x="85" y="124" width="9" height="6" rx="4.5"/>
    <rect class="bar" x="96" y="124" width="9" height="6" rx="4.5"/><rect class="bar" x="107" y="124" width="9" height="6" rx="4.5"/>
    <rect class="bar" x="120" y="124" width="9" height="6" rx="4.5"/>
   </g>
   <g id="dots" fill="var(--glow)"><circle cx="86" cy="127" r="4"/><circle cx="100" cy="127" r="4"/><circle cx="114" cy="127" r="4"/></g>
   <text id="bang" x="100" y="136" text-anchor="middle" font-size="26" font-weight="700" fill="var(--amber)">!</text>
  </g>
  <g id="zzz" fill="var(--metal)" font-weight="700" font-size="16"><text x="158" y="48">z</text><text x="170" y="34" font-size="12">z</text></g>
 </g>
</svg>
<div id="label"></div>
<script>
const svg=document.getElementById('bolt'),label=document.getElementById('label');
const bars=[...document.querySelectorAll('.bar')];
const LABEL={off:'asleep (voice mode off)',loading:'waking up…',listening:'listening',hearing:'hearing you',transcribing:'thinking…',waiting:'thinking…',speaking:'',barge:'oh!'};
let state='off',prev='off',level=0,target=0,lastOk=0,bargeUntil=0;
function setState(s){
  if(s===state)return;
  prev=state;state=s;
  if(prev==='speaking'&&(s==='hearing'||s==='transcribing')){bargeUntil=performance.now()+650;} // barge-in: speech cut off by the user
}
async function poll(){
  try{
    const r=await fetch('/api/s',{cache:'no-store'});const j=await r.json();
    lastOk=performance.now();target=Math.min(1,j.level*5);setState(j.state);
  }catch(e){ if(performance.now()-lastOk>2000){target=0;setState('off');} }
}
setInterval(poll,50);
const seeds=[0.9,0.6,1,0.7,0.85];let tick=0;
function frame(t){
  tick++;
  level+=(target-level)*(target>level?0.6:0.2);          // quick attack, slower release
  const shown=(t<bargeUntil)?'barge':state;
  if(svg.dataset.s!==shown){svg.dataset.s=shown;}
  label.textContent=LABEL[shown]??shown;
  if(shown==='speaking'){
    bars.forEach((b,i)=>{
      const wob=0.55+0.45*Math.sin(t/90*(i+1.3)+i*2);   // each bar moves a little differently
      const h=6+level*seeds[i]*(0.5+0.5*wob)*46;
      b.setAttribute('height',h.toFixed(1));b.setAttribute('y',(127-h/2).toFixed(1));
    });
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
// ?demo=speaking etc. lets the page be previewed without the voice loop
const demo=new URLSearchParams(location.search).get('demo');
if(demo){clearInterval(0);window.fetch=()=>Promise.resolve({json:()=>Promise.resolve({state:demo,level:demo==='speaking'?0.04+Math.random()*0.16*(Math.sin(Date.now()/130)>-.3?1:0):0})})}
</script></body></html>
