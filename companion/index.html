<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>J</title>
<style>
html,body{height:100%;margin:0}
body{background:#f4efe6;color:#3a2f2a;font:13px -apple-system,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;transition:background .3s}
#stage{width:min(88vw,46vh);max-width:420px}
#stage svg{width:100%;height:auto;overflow:visible}
#label{margin-top:10px;opacity:.55;letter-spacing:.04em;min-height:1.2em}
#note{position:fixed;top:14px;left:50%;transform:translateX(-50%) translateY(-8px);max-width:86vw;padding:8px 14px;border-radius:999px;background:#fff;color:#1b2b2a;box-shadow:0 2px 10px #0003;font-size:14px;font-weight:600;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#note.show{opacity:1;transform:translateX(-50%)}
#note i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px;background:var(--dot)}
#lyr{flex:none;position:relative;width:min(92vw,520px);height:7.8em;margin-top:6px;overflow:hidden;font:600 20px/2.6rem -apple-system,system-ui,sans-serif;text-align:center;opacity:0;transition:opacity .4s}
#lyr.on{opacity:1}
#lyr .rail{position:absolute;left:0;right:0;top:0;transition:transform .45s cubic-bezier(.3,.7,.2,1)}
#lyr .ln{height:2.6rem;white-space:nowrap;opacity:0;transition:opacity .35s}
#lyr .ln.a{opacity:1}#lyr .ln.n{opacity:.38}
#lyr .w{display:inline-block;white-space:pre;padding:0 .05em;border-radius:.3em;transition:background .12s,color .12s,opacity .2s}
#lyr .ln.a .w.f{opacity:.55}
#lyr .w.on{background:var(--hl,#3a2f2a);color:var(--hlt,#f4efe6);opacity:1}
#badge{position:fixed;top:8px;left:8px;padding:5px 11px;border-radius:14px;font:600 13px system-ui,sans-serif;color:#fff;background:#2e8b57;z-index:9}
#badge[data-k=paused],#badge[data-k=loading]{background:#c77d0a}#badge[data-k=speaking]{background:#2f6fb5}#badge[data-k=off]{background:#6b6b6b}#badge[data-k=muted]{background:#d32f2f;font-size:15px}
body.muted::after{content:"";position:fixed;inset:0;border:6px solid #d32f2f;pointer-events:none;z-index:8}
</style></head><body>
<div id="stage"></div>
<div id="badge" data-k="off"></div><div id="note"><i></i><span></span></div>
<div id="label"></div><div id="lyr"><div class="rail"></div></div>
<script src="/engine.js"></script><script src="/looks.js"></script><script src="/anime.js"></script>
<script>
/* The live J panel: polls /api/s (voice state, audio level, worker news) and drives the chosen look with the shared
   engine. Pick the look with ?look=robot|hana|mio|yuki|mochi|sprout|nimbus|kit|orbit (default below). */
const DEFAULT_LOOK='hana02';
const qs=new URLSearchParams(location.search);
const look=LOOKS[qs.get('look')]||LOOKS[DEFAULT_LOOK];
document.body.style.background=look.card.bg;document.body.style.color=look.card.fg;
const c=new Companion(document.getElementById('stage'),look);
const label=document.getElementById('label');
const LABEL={off:'asleep (voice mode off)',loading:'waking up…',listening:'listening',hearing:'hearing you',transcribing:'thinking…',waiting:'thinking…',speaking:'',barge:'oh!',muted:'muted (tap right Option)'};
const IN={state:'off',level:0,q:false,noteKind:'',noteUntil:0,bargeUntil:0,vis:null,lipLag:+(qs.get('lag')||0)};   // ?lag=ms delays the mouth (negative = earlier)
let target=0,lastOk=0,noteN=-1;
function setState(s){s=s.replace('-muted','');IN.state=s==='muted'||s==='paused'?'listening':s}   // the engine debounces blips and detects barge-in (speaking -> hearing that sticks) itself
const KCOL={waiting:'#6ee7a0',needs_you:'#ffb347',done:'#7fc8c4',blocked:'#ff6b6b'};
function showNote(n){   // a worker session changed status (the server also speaks it when voice mode is on)
  if(!n)return;
  if(noteN===-1){noteN=n.n;if(n.age>20)return}          // a page opened later only shows a recent one
  else if(n.n===noteN)return;
  noteN=n.n;IN.noteKind=n.kind;IN.noteUntil=performance.now()+9000;
  const el=document.getElementById('note');el.querySelector('span').textContent=n.text;el.style.setProperty('--dot',KCOL[n.kind]||'#999');el.classList.add('show');
  clearTimeout(showNote.t);showNote.t=setTimeout(()=>el.classList.remove('show'),9000);
}
/* Always-visible mic badge, straight from speakd's real state (voice-state file via /api/s): MUTED (red, with a red
   frame round the page) when the right-Option tap muted listening, else SPEAKING / LISTENING / OFF. */
const bd=document.getElementById('badge');
function badge(s){
  const muted=s==='muted'||s.endsWith('-muted');
  const kind=s==='off'?'off':s==='loading'?'loading':muted?'muted':s==='paused'?'paused':(s.startsWith('speaking')?'speaking':'listening');
  const txt={off:'VOICE OFF',muted:'MUTED - not listening',paused:'PAUSED - tap Right Command',loading:'WAKING UP...',speaking:'SPEAKING',listening:'LISTENING'}[kind];
  const ic={off:'\u{1F634}',muted:'\u{1F507}',paused:'\u23F8',loading:'\u23F3',speaking:'\u{1F50A}',listening:'\u{1F3A4}'}[kind];
  if(bd.dataset.k!==kind){bd.dataset.k=kind;bd.textContent=ic+' '+txt;document.body.classList.toggle('muted',kind==='muted')}
}

/* Karaoke text: speakd publishes every word of the reply with the time it reaches the speaker (vis.wd = [[number, start, end,
   text, opensLine]..]). Words wrap into lines of about LINE_CH characters (a new paragraph always starts a line); the line being
   spoken is kept vertically centred in #lyr, the lines above and below it are dimmer, and the word being said is highlighted.
   ?text=0 turns it off. */
const lyr=document.getElementById('lyr'),rail=lyr.querySelector('.rail');
const LINE_CH=Math.max(14,+(qs.get('chars')||30));
let lines=[],lyrSig='',lastWd=0,curLine=-1;
function layout(wd){
  const out=[];let cur=null,len=0;
  for(const w of wd){
    const t=w[3];
    if(!cur||w[4]||(len+t.trim().length>LINE_CH&&len>0)){cur={w:[],el:null};out.push(cur);len=0}
    cur.w.push(w);len+=t.length;
  }
  return out;
}
function build(wd){
  lines=layout(wd);rail.textContent='';
  for(const L of lines){
    const d=document.createElement('div');d.className='ln';
    L.spans=L.w.map(w=>{const sp=document.createElement('span');sp.className='w';sp.textContent=w[3].replace(/\s+$/,'')+(/\s$/.test(w[3])?' ':'');d.appendChild(sp);return sp});
    L.el=d;rail.appendChild(d);
  }
  curLine=-1;
}
function lyrics(V,wall){
  if(qs.get('text')==='0')return;
  const wd=V&&V.wd&&wall-V.w<.5?V.wd:null;
  if(!wd){ if(lyr.classList.contains('on')&&wall-lastWd>1.2){lyr.classList.remove('on');lyrSig=''} return; }
  lastWd=wall;
  const sig=wd.length+':'+wd[0][0]+':'+wd[wd.length-1][0];
  if(sig!==lyrSig){lyrSig=sig;build(wd)}
  lyr.classList.add('on');
  const tw=wall-(IN.lipLag||0)/1000;
  let ci=0;                                               // the word being said: the last one that has started
  for(let i=0;i<wd.length;i++){if(wd[i][1]<=tw)ci=i;else break}
  let li=0,k=ci,wi=0;                                     // which line and word that is
  for(let l=0;l<lines.length;l++){if(k<lines[l].w.length){li=l;wi=k;break}k-=lines[l].w.length}
  const said=tw>=wd[ci][1]&&tw<wd[ci][2]+.25;
  lines.forEach((L,l)=>{
    L.el.className='ln'+(l===li?' a':Math.abs(l-li)===1?' n':'');
    if(Math.abs(l-li)<=1)L.spans.forEach((sp,j)=>{sp.className='w'+(l===li&&j===wi&&said?' on':'')+(l===li&&j>wi||l===li&&j===wi&&!said?' f':'')});
  });
  if(li!==curLine){curLine=li;const lh=lines[li].el.offsetHeight||40;rail.style.transform='translateY('+(lyr.clientHeight/2-(li+.5)*lh)+'px)'}
}
async function poll(){
  try{
    const r=await fetch('/api/s',{cache:'no-store'});const j=await r.json();
    lastOk=performance.now();target=Math.min(1,j.level*5);IN.q=!!j.q;IN.vis=j.vis;lyrics(j.vis,Date.now()/1000);setState(j.state);badge(j.state);showNote(j.note);
  }catch(e){ if(performance.now()-lastOk>4000){target=0;setState('off');badge('off');} }
}
setInterval(poll,50);
let level=0;
function frame(t){
  level+=(target-level)*(target>level?0.6:0.2);          // quick attack, slower release
  IN.level=level;c.tick(t,IN);
  label.textContent=LABEL[c.shown||IN.state]??IN.state;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
// ?demo=speaking (&q=1 for a question, &note=done|needs_you|blocked) previews a state without the voice loop
const demo=qs.get('demo'),demoNote=qs.get('note');
const DEMO_TXT="Hello Trevor. I read the latest messages from Mychal, and nothing needs a reply today. He is waiting for you to pick a time for the call. The duplicate movie stills should clear once the upload finishes. Do you want me to summarize the days in between?";
function demoWords(){   // ?demo=speaking fakes a reply being spoken: 0.33 s per word, paragraphs after each sentence, looping
  const now=Date.now()/1000,ws=DEMO_TXT.split(/(?<=[.?]) /),t0=Math.floor(now/60)*60-0;let n=0,t=t0+ (now-t0)%1*0,out=[];
  const total=DEMO_TXT.split(' ').length*.33+3;const base=now-((now-t0)%total);let u=base;
  ws.forEach(sent=>sent.split(' ').forEach((w,i)=>{out.push([n++,+u.toFixed(3),+(u+.3).toFixed(3),w+' ',i===0?1:0]);u+=.33}));
  return out;
}
if(demo){window.fetch=()=>Promise.resolve({json:()=>Promise.resolve({state:demo,q:qs.get('q')==='1',
  note:demoNote?{n:1,age:0,kind:demoNote,text:{needs_you:'Saint videos needs permission',done:'Saint videos is done',blocked:'Saint videos is blocked'}[demoNote]}:null,
  vis:demo==='speaking'&&qs.get('karaoke')!=='0'?{w:Date.now()/1000,ev:[],wd:demoWords()}:null,
  level:demo==='speaking'?(Math.sin(Date.now()/130)>-.3?0.03+Math.random()*0.17*(Math.sin(Date.now()/1700)>.5?1.6:1):0):0})})}
</script></body></html>
